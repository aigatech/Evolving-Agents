objects:
  - type: DatasetObject
    name: delicious_apple
    category: apple
    model: agveuv
    position: [1.0, 0, 1.0]

task:
  type: BehaviorTask
  activity_name: make_pizza
  activity_definition_id: 0
  activity_instance_id: 0
  predefined_problem: null
  online_object_sampling: false
  debug_object_sampling: null
  highlight_task_relevant_objects: false
  use_presampled_robot_pose: true
  termination_config:
    max_steps: 500
  reward_config:
    r_potential: 1.0
