env:
  device: null
  automatic_reset: false
  flatten_action_space: false
  flatten_obs_space: false
  use_external_obs: false
  initial_pos_z_offset: 0.1

  # External camera for a stable image source (not tied to robot model)
  external_sensors:
    - sensor_type: VisionSensor
      name: external_sensor0
      relative_prim_path: /external_sensor0
      modalities: [rgb, depth]
      sensor_kwargs:
        image_height: 256
        image_width: 256
      # Adjust to frame the kitchen/fridge; tweak as needed
      position: [0.0, -3.0, 1.5]
      orientation: [0.0, 0.0, 0.0, 1.0]
      pose_frame: parent

render:
  viewer_width: 1280
  viewer_height: 720

scene:
  type: InteractiveTraversableScene
  scene_model: house_double_floor_lower
  trav_map_resolution: 0.1
  default_erosion_radius: 0.0
  trav_map_with_objects: true
  num_waypoints: 1
  waypoint_resolution: 0.2
  not_load_object_categories: null
  load_room_types: ["kitchen", "living_room"]
  load_room_instances: null
  seg_map_resolution: 1.0
  scene_source: OG
  include_robots: true

robots:
  - type: R1Pro
    name: r1
    obs_modalities: [rgb, depth]
    scale: 1.0
    self_collision: false
    action_normalize: true
    action_type: continuous
    grasping_mode: physical
    default_reset_mode: tuck
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          image_height: 512
          image_width: 512
    controller_config:
      base:
        name: HolonomicBaseJointController
        motor_type: velocity
        vel_kp: 150
        command_input_limits: default
        command_output_limits: default
        use_impedances: false
      trunk:
        name: JointController
        motor_type: position
        pos_kp: 150
        command_input_limits: default
        command_output_limits: default
        use_impedances: false
        use_delta_commands: false
      arm_left:
        name: JointController
        motor_type: position
        pos_kp: 150
        command_input_limits: default
        command_output_limits: default
        use_impedances: false
        use_delta_commands: false
      arm_right:
        name: JointController
        motor_type: position
        pos_kp: 150
        command_input_limits: default
        command_output_limits: default
        use_impedances: false
        use_delta_commands: false
      gripper_left:
        name: MultiFingerGripperController
        mode: smooth
        command_input_limits: default
        command_output_limits: default
      gripper_right:
        name: MultiFingerGripperController
        mode: smooth
        command_input_limits: default
        command_output_limits: default

task:
  type: BehaviorTask
  activity_name: bringing_water     # folder name under OG_BDDL_ROOT (bringing_water/)
  predefined_problem: problem0      # file name (problem0.bddl)
  activity_definition_id: 0
  activity_instance_id: 0
  online_object_sampling: false     # use the predefined instance from the BDDL
  debug_object_sampling: null
  highlight_task_relevant_objects: false
  use_presampled_robot_pose: true
  termination_config:
    max_steps: 1                    # just build + snapshot
  reward_config:
    r_potential: 1.0
